<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="__THEME_COLOR__">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>__TITLE__</title>
<style>
:root{
  --paper:#F7EEDC; --paper2:#FFFCF4; --paper3:#F2E6CE;
  --ink:#211C15; --ink2:#5B5240; --ink3:#8E846A;
  --red:#C8503A; --mustard:#E5A93C; --olive:#6D8B4B; --sky:#6FA8CF; --terra:#C1764A;
  --sh:4px 4px 0 var(--ink); --sh-sm:2px 2px 0 var(--ink);
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Yuanti SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  background-image:radial-gradient(var(--paper3) 1px, transparent 1px);background-size:14px 14px;
  padding-bottom:calc(46px + env(safe-area-inset-bottom));
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.01em}
a{color:inherit;text-decoration:none}

.top{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:3px solid var(--ink)}
.top .brand{display:flex;align-items:center;gap:8px;padding:9px 14px 7px;max-width:720px;margin:0 auto}
.top .brand b{font-size:14.5px;font-weight:800}
.top .brand .cd{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--red)}
.nav{display:flex;gap:7px;overflow-x:auto;padding:0 14px 9px;max-width:720px;margin:0 auto;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:800;color:var(--ink);
  background:var(--paper2);border:2px solid var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.nav button.on{background:var(--mustard);box-shadow:var(--sh-sm)}

.hero{margin:0 auto 18px;max-width:720px;background:var(--paper2);border-bottom:3px solid var(--ink)}
.hero img{display:block;width:100%;height:auto;border-bottom:2.5px solid var(--ink)}
.hero .cap{padding:12px 16px;display:flex;align-items:flex-start;gap:12px}
.hero .kick{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--red)}
.hero h1{font-size:21px;margin:4px 0 3px}
.hero .sub{font-size:12.5px;color:var(--ink2)}
.hero .stamp{flex:0 0 auto;margin-left:auto;text-align:center;border:2.5px solid var(--ink);
  border-radius:8px;padding:6px 9px;background:var(--mustard);box-shadow:var(--sh-sm);font-size:10.5px;font-weight:800;line-height:1.3}
.hero .stamp em{display:block;font-style:normal;font-size:19px}

.page{display:none}
.page.on{display:block}
.sec{margin:0 0 24px}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.sec-h .bar{width:6px;height:20px;background:var(--red);border:2px solid var(--ink);border-radius:2px}
.sec-h h2{font-size:16px}
.sec-h .cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink3)}
.panel{background:var(--paper2);border:2.5px solid var(--ink);border-radius:var(--r);
  box-shadow:var(--sh);padding:13px 14px;margin-bottom:12px}
.tag{display:inline-block;font-size:11px;font-weight:800;line-height:1;padding:4px 9px;
  border:2px solid var(--ink);border-radius:999px;background:var(--mustard);
  box-shadow:1.5px 1.5px 0 var(--ink);white-space:nowrap}
.tag.red{background:var(--red);color:#FFF9EC}
.tag.green{background:var(--olive);color:#FFF9EC}
.tag.sky{background:var(--sky);color:#0E222C}
.tag.paper{background:var(--paper3);color:var(--ink2)}

.btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:800;color:var(--ink);
  background:var(--paper2);border:2.5px solid var(--ink);border-radius:8px;padding:7px 12px;
  box-shadow:var(--sh-sm);cursor:pointer;transition:.12s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--mustard)}
.btn.gho{background:var(--paper3)}
.btn.sm{font-size:11.5px;padding:5px 10px;border-width:2px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.hint{display:flex;gap:9px;align-items:flex-start;background:var(--paper2);
  border:2.5px dashed var(--ink);border-radius:var(--r);padding:11px 12px;font-size:13px;color:var(--ink2);margin-bottom:10px}
.hint b{color:var(--ink)}
.hint .ico{flex:0 0 auto;font-weight:800;width:18px;text-align:center}
.hint.red{border-color:var(--red);border-style:solid}

.tl{position:relative;padding-left:36px}
.tl:before{content:"";position:absolute;left:14px;top:8px;bottom:8px;border-left:3px dotted var(--ink);opacity:.45}
.day{position:relative;margin-bottom:15px;background:var(--paper2);border:2.5px solid var(--ink);
  border-radius:var(--r);box-shadow:var(--sh);padding:12px 13px}
.day .dot{position:absolute;left:-36px;top:10px;width:30px;height:30px;border-radius:50%;
  background:var(--mustard);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800;line-height:1}
.day.today{box-shadow:5px 5px 0 var(--red);border-color:var(--red)}
.day.today .dot{background:var(--red);color:#FFF9EC}
.day .ttl{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.day .sub{font-size:12.5px;color:var(--ink2);margin-bottom:9px}
.it{display:flex;gap:9px;padding:6px 0;border-top:2px dotted rgba(33,28,21,.18);font-size:13px}
.it .t{flex:0 0 48px;font-weight:800;font-size:12.5px;color:var(--red)}
.it .x{flex:1;min-width:0;color:var(--ink2);line-height:1.55}
.it .x b{color:var(--ink)}
.it.warn{background:rgba(200,80,58,.07);border-radius:6px;padding:6px 7px;margin:3px 0}

.shop{border-top:2px dotted rgba(33,28,21,.22);padding-top:10px;margin-top:10px}
.shop:first-child{border-top:0;padding-top:0;margin-top:0}
.shop .nm{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.shop .kv{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.shop .kv b{color:var(--ink);font-weight:800}
.shop .note{font-size:12px;color:var(--ink3);margin-top:5px;line-height:1.5}
.star{color:var(--red);font-weight:800}

.tb{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.tb th,.tb td{border:2px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
.tb th{background:var(--paper3);font-weight:800;font-size:12px}
.tb td b{font-weight:800}
.list{margin:0;padding-left:19px;font-size:13px;color:var(--ink2)}
.list li{margin-bottom:5px;line-height:1.55}
.list b{color:var(--ink)}

.src{margin-top:26px;padding-top:13px;border-top:2.5px solid var(--ink);font-size:11.5px;color:var(--ink2);line-height:1.75}
.src b{color:var(--ink)}
.flag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;border:2px solid var(--ink);background:var(--paper3);margin-left:4px;vertical-align:1px}
.flag.ok{background:var(--olive);color:#FFF9EC}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:var(--mustard);color:var(--ink);border:2.5px solid var(--ink);border-radius:9px;padding:9px 16px;
  font-size:13px;font-weight:800;box-shadow:var(--sh-sm);opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);padding:16px 0 6px}
</style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

  h += '<div class="sub">' + d.w + ' · ' + d.sub + '</div>';
  d.items.forEach(function(it){
    h += '<div class="it' + (it.warn ? ' warn' : '') + '"><span class="t">' + it.t + '</span><span class="x">' + it.x + '</span></div>';
  });

    h += '<div class="hint red" style="margin-top:11px"><span class="ico">!</span><div style="flex:1">';
    d.warnList.forEach(function(w){ h += '<div>· ' + w + '</div>'; });

}

function shopCard(s){
  var h = '<div class="shop">';
  h += '<div class="nm">' + (s.star ? '<span class="star">★</span>' : '') + s.name + (s.sub ? ' <span class="tag paper">' + s.sub + '</span>' : '') + '</div>';
  h += '<div class="kv">📍 ' + s.addr + (s.hours ? '　🕘 ' + s.hours : '') + '</div>';
  if(s.tel) h += '<div class="kv">☎ <b>' + s.tel + '</b></div>';
  if(s.dish) h += '<div class="kv">🍽 ' + s.dish + '</div>';
  if(s.note) h += '<div class="note">' + s.note + '</div>';
  h += '<div class="acts"><a class="btn sm pri" href="' + mapUrl(s.name) + '" target="_blank" rel="noopener">导航</a>';
  if(s.tel) h += '<a class="btn sm" href="' + telUrl(s.tel) + '">拨号</a>';

  return h;
}

/* ================= 交互 ================= */

/* PAGES 由 CITIES 自动生成：城市增减只改 CITIES，不用动这里。
   顺序 = Tab 顺序 = 行程顺序。id 自动与 CITIES[].id 对齐。 */
var PAGES = [{ id:'overview', name:'总览', render: overviewPage }]
  .concat(CITIES.map(function(c, i){
    return { id: c.id, name: c.name,
             render: (function(k){ return function(){ return cityPage(CITIES[k]); }; })(i) };
  }))
  .concat([
    { id:'wallet', name:'票夹', render: walletPage },
    { id:'help',   name:'应急', render: emergencyPage }
  ]);

function todayCityId(){
  var m = CFG.dayMap;
  var now = new Date();
  return m[(now.getMonth() + 1) + '/' + now.getDate()] || null;
}

function show(id){
  var ps = document.querySelectorAll('.page');
  for(var i = 0; i < ps.length; i++) ps[i].classList.toggle('on', ps[i].id === 'pg-' + id);
  var bs = document.querySelectorAll('#nav button');
  for(var j = 0; j < bs.length; j++) bs[j].classList.toggle('on', bs[j].getAttribute('data-id') === id);

  // 顶部封面随当前城市切换
  var city = null;
  for(var k = 0; k < CITIES.length; k++){ if(CITIES[k].id === id){ city = CITIES[k]; break; } }
  var hi = document.getElementById('heroImg');
  if(hi){
    if(city){
      if(hi.getAttribute('src') !== city.img) hi.setAttribute('src', city.img);
      hi.setAttribute('alt', city.name);
      document.getElementById('heroKick').textContent = city.period + ' · ' + city.nights;
      document.getElementById('heroTitle').textContent = city.name;
      document.getElementById('heroSub').textContent = city.kw;
    }else{
      if(hi.getAttribute('src') !== CFG.heroImg) hi.setAttribute('src', CFG.heroImg);
      hi.setAttribute('alt', CFG.heroAlt);
      document.getElementById('heroKick').textContent = CFG.kick;
      document.getElementById('heroTitle').textContent = CFG.title;
      document.getElementById('heroSub').textContent = CFG.sub;
    }
  }
  window.scrollTo(0, 0);
}

function init(){
  var app = document.getElementById('app'), nav = document.getElementById('nav');
  var pageHtml = '';
  PAGES.forEach(function(p){ pageHtml += '<div class="page" id="pg-' + p.id + '">' + p.render() + '</div>'; });
  app.innerHTML = pageHtml + '<div class="foot">' + CFG.foot + '</div>';

  var navHtml = '';
  PAGES.forEach(function(p){ navHtml += '<button data-id="' + p.id + '">' + p.name + '</button>'; });
  nav.innerHTML = navHtml;
  var bs = nav.querySelectorAll('button');
  for(var i = 0; i < bs.length; i++){
    (function(b){ b.addEventListener('click', function(){ show(b.getAttribute('data-id')); }); })(bs[i]);
  }

  show(todayCityId() || 'overview');
  tick();
  setInterval(tick, 1000);
}

function tick(){
  var now = new Date();
  var t0 = new Date(CFG.t0[0], CFG.t0[1], CFG.t0[2]);
  var t1 = new Date(CFG.t1[0], CFG.t1[1], CFG.t1[2]);
  var top = document.getElementById('topCd'), stamp = document.getElementById('heroStamp');
  if(now < t0){
    var days = Math.ceil((t0 - now) / 86400000);
    top.textContent = '距出发 ' + days + ' 天';
    if(stamp) stamp.innerHTML = '距出发<em>' + days + '</em>天';
  } else if(now < t1){
    var d = Math.floor((now - t0) / 86400000) + 1;
    top.textContent = 'D' + d + ' / ' + CFG.totalDays;
    if(stamp) stamp.innerHTML = '行程中<em>D' + d + '</em>';
  } else {
    top.textContent = '行程已结束';
    if(stamp) stamp.innerHTML = '行程<em>结束</em>';
  }
}

init();
